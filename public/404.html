<!doctype html>
<!--
  Placeholder 404 page -- intentionally plain, restyle freely.

  This file is load-bearing on Cloudflare Pages: when no 404.html exists in the
  build output, Pages falls back to serving index.html with HTTP 200, turning
  every dead link and mistyped URL into a soft 404. Vercel returned a real 404,
  so without this the migration would regress site-wide.

  Shared by both builds (srcset.tips and img.style), so the copy stays
  site-neutral and links to the docs root rather than naming either site.

  If a designed src/pages/404.astro is added later, delete this file -- Astro
  will emit its own 404.html and two sources would collide.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #14161d;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 2rem;
      }
      main { max-width: 32rem; }
      h1 { font-size: 3.5rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
      p { margin: 0 0 1.5rem; color: #5b6273; }
      a.home {
        display: inline-block; text-decoration: none; color: #fff;
        background: #1f6feb; padding: .6rem 1.1rem; border-radius: .5rem; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3; }
        p { color: #9aa4b2; }
        a.home { background: #58a6ff; color: #0d1117; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>That page doesn&rsquo;t exist. It may have moved, or the link that brought you here may be out of date.</p>
      <p><a class="home" href="/en/introduction/">Back to the docs</a></p>
    </main>
  </body>
</html>
